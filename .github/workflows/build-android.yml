name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Сборка APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Установить нужные компоненты SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Сборка (debug + release)
        working-directory: android
        env:
          # Необязательно: свой API-ключ Nothing. Без него используется "test".
          NOTHING_API_KEY: ${{ secrets.NOTHING_API_KEY }}
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Собрать артефакты
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/GlyphNfcPay-release.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk out/GlyphNfcPay-debug.apk
          ls -lh out

      - name: Загрузить APK как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: GlyphNfcPay-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Опубликовать релиз (по тегу v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/GlyphNfcPay-release.apk
          generate_release_notes: true
