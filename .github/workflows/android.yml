name: Build TapGlyph APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TapGlyph
        uses: actions/checkout@v4

      - name: Checkout official Nothing Glyph SDK
        uses: actions/checkout@v4
        with:
          repository: Nothing-Developer-Programme/Glyph-Developer-Kit
          path: .glyph-developer-kit

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The legacy SDK package "tools" has been removed by Google.
          # setup-android installs command-line tools separately; we only need platform-tools here.
          packages: platform-tools

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Add official Glyph SDK to app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/libs

          # Nothing now publishes the Glyph SDK as an AAR (currently under sdk/).
          # Keep the legacy JAR fallback for older revisions of the official repo.
          SDK_FILE="$(find .glyph-developer-kit -type f -iname 'glyph-matrix-sdk-*.aar' | sort -V | tail -n 1)"
          if [[ -z "$SDK_FILE" ]]; then
            SDK_FILE="$(find .glyph-developer-kit -type f -iname 'KetchumSDK_Community_*.jar' | sort -V | tail -n 1)"
          fi

          if [[ -z "$SDK_FILE" ]]; then
            echo "Could not find the official Nothing Glyph SDK (.aar or legacy .jar)."
            echo "Files available in the checked-out repository:"
            find .glyph-developer-kit -type f -print | sort || true
            exit 1
          fi

          cp "$SDK_FILE" app/libs/
          echo "Using official Nothing SDK: $SDK_FILE"
          ls -lh app/libs/

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/TapGlyph-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TapGlyph-debug-apk
          path: app/build/outputs/apk/debug/TapGlyph-debug.apk
          if-no-files-found: error
          retention-days: 14
